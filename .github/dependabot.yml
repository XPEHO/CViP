version: 2

updates:
  # npm dependencies (all workspaces, single lockfile at the root)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Base Docker images
  - package-ecosystem: 'docker'
    directories:
      - '/cvip_backend'
      - '/cvip_frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Paris'
    commit-message:
      prefix: 'chore(docker)'

  # Postgres image of docker-compose
  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Paris'
    commit-message:
      prefix: 'chore(docker)'

  # Actions used in the CI/CD workflows (pinned by SHA: the version tag stays in a comment)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Paris'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns:
          - '*'
