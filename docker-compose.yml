# Local development and CI stack. Configuration: copy .env.example to .env (ignored by git).
# Variables marked `:?` have no default: compose refuses to start without them.
services:
  db:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is missing, see .env.example}
    ports:
      # Reachable from this machine only.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: cvip_backend/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
    ports:
      # Reachable from this machine only.
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: cvip_frontend/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      # Reachable from this machine only.
      - '127.0.0.1:${FRONTEND_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
